[workspace]
resolver = "3"
members = [
    "crates/nfssave-core",
    "crates/fatx",
    "crates/nfspc-converter",
]

# Shared metadata; members inherit via `version.workspace = true` /
# `edition.workspace = true`.
[workspace.package]
version = "1.1.0"
edition = "2024"

# Release wiring for the converter app: maximum-size optimization.
# The static CRT comes from .cargo/config.toml (crt-static).
[profile.release]
lto = true
strip = true
codegen-units = 1
